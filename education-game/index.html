<style>
:root{--c:#22d3ee;--p:#fb37d8;--g:#facc15;--ok:#22c55e;--bad:#fb365f;--ink:#07111f}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:white;background:#050816;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 12% 8%,rgba(251,55,216,.36),transparent 28%),radial-gradient(circle at 86% 18%,rgba(34,211,238,.34),transparent 30%),radial-gradient(circle at 45% 100%,rgba(250,204,21,.18),transparent 34%),linear-gradient(135deg,#050816,#111142 48%,#052233)}
body:after{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,rgba(0,0,0,.18))}
button,input{font-family:inherit}button{border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:11px 15px;color:white;background:rgba(255,255,255,.12);font-weight:1000;cursor:pointer;transition:.12s;touch-action:manipulation}button:hover{transform:translateY(-1px) scale(1.015);background:rgba(255,255,255,.2)}button:active{transform:scale(.97)}.primary{background:linear-gradient(135deg,var(--c),var(--g));color:#07111f}.purple{background:linear-gradient(135deg,#8b5cf6,var(--p))}.active{background:linear-gradient(135deg,var(--c),#93c5fd)!important;color:#06121f!important;box-shadow:0 0 26px rgba(34,211,238,.4)}
#stars span{position:fixed;z-index:-1;opacity:.45;animation:rise 9s linear infinite;font-size:24px}#toast{position:fixed;right:18px;top:18px;z-index:80}.toast{background:#101827;border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:14px 18px;box-shadow:0 20px 60px rgba(0,0,0,.45);font-weight:900;animation:slide .25s}#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}#confetti i{position:absolute;width:11px;height:17px;border-radius:3px;animation:fall 1.8s linear forwards}#combo{position:fixed;left:50%;top:23%;transform:translate(-50%,-50%);z-index:75;pointer-events:none}.combo{font-size:clamp(38px,8vw,82px);font-weight:1000;text-shadow:0 10px 35px rgba(0,0,0,.7);animation:pop .9s forwards}
.app{max-width:1580px;margin:0 auto;padding:16px}.header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}.brand{display:flex;align-items:center;gap:13px}.avatar{width:88px;height:88px;border-radius:30px;display:grid;place-items:center;font-size:50px;background:linear-gradient(135deg,var(--c),var(--p));box-shadow:0 0 42px rgba(34,211,238,.48),inset 0 2px rgba(255,255,255,.35);animation:bob 2.1s infinite ease-in-out}h1{margin:0;font-size:clamp(32px,5vw,72px);line-height:.9;font-weight:1000;letter-spacing:-2.5px}.subtitle{color:#dbeafe;font-weight:900;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(6,86px);gap:8px}.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:23px;padding:10px;text-align:center;box-shadow:0 12px 34px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.16)}.stat b{display:block;font-size:23px}.stat span{font-size:10px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.5px;font-weight:1000}
.homeGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:12px}.hero,.glass,.card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:34px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.24);backdrop-filter:blur(12px)}.hero h2{font-size:clamp(34px,5vw,66px);line-height:.95;margin:0 0 10px;font-weight:1000}.hero p,.card p{color:#dbeafe;font-weight:800;line-height:1.45}.bigModes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.modeBtn{border-radius:26px;text-align:left;min-height:116px;padding:18px;position:relative;overflow:hidden}.modeBtn strong{display:block;font-size:24px}.modeBtn small{display:block;color:#dbeafe;margin-top:7px;font-size:14px}.modeBtn em{position:absolute;right:16px;bottom:8px;font-size:46px;font-style:normal;opacity:.6}.paperGrid{display:flex;gap:7px;flex-wrap:wrap}.paperGrid button{padding:9px 12px}.petBox{display:flex;align-items:center;gap:14px}.pet{font-size:64px}.petSpeech{background:rgba(0,0,0,.2);padding:12px 14px;border-radius:20px;color:#dbeafe;font-weight:900}
.track{height:28px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.18);border-radius:999px;overflow:hidden;position:relative;margin:12px 0}.trackFill{height:100%;background:linear-gradient(90deg,var(--c),var(--p),var(--g));transition:width .35s}.runner{position:absolute;top:-8px;font-size:36px;transform:translateX(-50%);transition:left .35s;filter:drop-shadow(0 7px 9px rgba(0,0,0,.45))}
.main{display:grid;grid-template-columns:1fr 410px;gap:14px}.arena{background:rgba(255,255,255,.97);color:var(--ink);border-radius:34px;padding:15px;box-shadow:0 30px 100px rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.85);position:relative;overflow:hidden}.arena:before{content:"";position:absolute;inset:0 0 auto;height:7px;background:linear-gradient(90deg,var(--c),var(--p),var(--g))}.arenaTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:8px 3px 12px}.arena h2{font-size:30px;margin:5px 0}.small{font-size:13px;color:#64748b;font-weight:1000}.tag{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:999px;padding:5px 10px;margin:2px;font-size:12px;font-weight:1000}.legendary{background:#fff7ed;color:#c2410c}.rare{background:#fdf2f8;color:#be185d}.boss{background:#fee2e2!important;color:#b91c1c!important;animation:pulse 1s infinite}.timer{font-size:32px;font-weight:1000;color:#b45309;text-align:right}.zoom{display:flex;gap:6px;justify-content:flex-end}.zoom button{background:#e2e8f0;color:#06121f;border-radius:16px}.imageFrame{overflow:auto;max-height:72vh;background:#e2e8f0;border:1px solid #cbd5e1;border-radius:24px;text-align:center}.imageFrame img{display:block;margin:0 auto;max-width:none;user-select:none}.side{display:flex;flex-direction:column;gap:12px}.card{border-radius:30px;padding:16px}.card h3{font-size:23px;margin:0 0 7px}.answers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:9px 0}.answer{height:58px;border-radius:18px;font-size:22px;background:rgba(255,255,255,.13)}.answer.selected{background:linear-gradient(135deg,var(--c),#93c5fd);color:#06121f;box-shadow:0 0 0 4px rgba(34,211,238,.16)}.input{width:100%;border:1px solid rgba(255,255,255,.22);border-radius:18px;background:rgba(0,0,0,.28);color:white;padding:14px;font-size:16px;font-weight:900;outline:0}.input:focus{border-color:var(--c);box-shadow:0 0 0 4px rgba(34,211,238,.16)}.result{margin-top:12px;padding:14px;border-radius:20px;font-weight:1000}.correct{background:rgba(34,197,94,.22);border:1px solid rgba(34,197,94,.42)}.wrong{background:rgba(251,54,95,.22);border:1px solid rgba(251,54,95,.45)}.quest{background:rgba(0,0,0,.2);border-radius:18px;padding:10px;margin-top:8px}.questbar{height:9px;background:rgba(0,0,0,.28);border-radius:999px;overflow:hidden;margin:6px 0}.questbar div{height:100%;background:linear-gradient(90deg,var(--ok),var(--c))}.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.shopItem{background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:10px}.shopItem .emo{font-size:30px}.shopItem button{width:100%;font-size:12px;margin-top:7px;padding:7px}.reel{height:168px;overflow:auto;scroll-snap-type:y mandatory;border-radius:22px;background:#020617;border:1px solid rgba(255,255,255,.16)}.clip{height:168px;scroll-snap-align:start;padding:14px;background:linear-gradient(135deg,rgba(251,55,216,.22),rgba(34,211,238,.14));display:flex;flex-direction:column;justify-content:center}.clip b{font-size:22px}.clip span{color:#dbeafe}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.badge{background:rgba(0,0,0,.2);border-radius:18px;padding:10px;text-align:center;font-weight:1000}.locked{opacity:.45;filter:grayscale(1)}.modal{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,6,23,.75);z-index:60;padding:16px}.modalBox{background:white;color:#06121f;border-radius:36px;padding:30px;max-width:850px;width:100%;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.55)}.modalBox h2{font-size:52px;margin:10px 0}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:20px 0}.summary div{background:#f1f5f9;border-radius:20px;padding:14px}.summary b{font-size:28px;display:block}.parentTable{width:100%;border-collapse:collapse;text-align:left}.parentTable th,.parentTable td{padding:8px;border-bottom:1px solid rgba(226,232,240,.2)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(3deg)}}@keyframes rise{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-20vh) rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.04)}}@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}@keyframes pop{0%{transform:scale(.4);opacity:0}35%{transform:scale(1.18);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
@media(max-width:1120px){.main,.homeGrid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,86px)}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{padding:10px}.stats{grid-template-columns:repeat(3,1fr);width:100%}.stat{padding:8px}.avatar{width:64px;height:64px;font-size:38px}.bigModes{grid-template-columns:1fr}.arena h2{font-size:23px}.imageFrame{max-height:62vh}.modalBox{padding:20px}.modalBox h2{font-size:38px}}
</style>

  if (sessionStorage.getItem("nestayraEducationUnlocked") !== "true") {
    document.documentElement.innerHTML = '<head><title>Education Locked</title><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body{margin:0;font-family:Arial,sans-serif;background:#020617;color:white;display:grid;place-items:center;min-height:100vh;padding:24px}.box{max-width:620px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:28px;padding:32px;text-align:center}a{color:#67e8f9;font-weight:800}</style></head><body><div class="box"><h1>🔒 Education game locked</h1><p>Please unlock the Education section first.</p><p><a href="../#education">Return to Education unlock</a></p></div></body>';

<div id="stars"></div><div id="toast"></div><div id="confetti"></div><div id="combo"></div><div id="app" class="app"></div>
<script src="questions.js"></script>
<script src="choice_map.js"></script>
<script>
const SAVE="galaxy-obby-best-kid-v1";
const saved=JSON.parse(localStorage.getItem(SAVE)||"{}");
const app=document.getElementById("app"),stars=document.getElementById("stars"),toastBox=document.getElementById("toast"),confettiBox=document.getElementById("confetti"),comboBox=document.getElementById("combo");
stars.innerHTML=["⭐","💎","🧠","🚀","⚡","🎯","👑","🔥","🪐","🌈"].map((s,i)=>`<span style="left:${4+i*10}vw;animation-delay:${i*.8}s">${s}</span>`).join("");
const PAPERS=["All",...new Set(QUESTIONS.map(q=>q.paper))], shop=[["🦊",120],["🐉",240],["🧙",320],["🚀",420],["👑",650],["🧠",800],["🐼",180],["🦄",500]];
let state={screen:"home",mode:"Story Obby",paper:"All",deck:[],index:0,selected:"",typed:"",locked:false,lastCorrect:null,score:0,streak:0,hearts:3,zoom:1,timer:0,timerId:null,coins:saved.coins||0,gems:saved.gems||0,xp:saved.xp||0,level:saved.level||1,avatar:saved.avatar||"🤖",owned:saved.owned||["🤖"],sound:saved.sound??true,bestStreak:saved.bestStreak||0,totalCorrect:saved.totalCorrect||0,totalPlayed:saved.totalPlayed||0,review:JSON.parse(localStorage.getItem("galaxy-review")||"[]"),daily:saved.daily||"",dailyClaimed:saved.dailyClaimed||false};
function save(){localStorage.setItem(SAVE,JSON.stringify({coins:state.coins,gems:state.gems,xp:state.xp,level:state.level,avatar:state.avatar,owned:state.owned,sound:state.sound,bestStreak:state.bestStreak,totalCorrect:state.totalCorrect,totalPlayed:state.totalPlayed,daily:state.daily,dailyClaimed:state.dailyClaimed}))}
function today(){return new Date().toISOString().slice(0,10)}
function checkDaily(){if(state.daily!==today()){state.daily=today();state.dailyClaimed=false;save()}}
function beep(f=600,d=.08,t="sine"){if(!state.sound)return;try{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type=t;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.045,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.start();o.stop(a.currentTime+d)}catch(e){}}
function vibrate(ms=35){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function toast(m){toastBox.innerHTML=`<div class="toast">${m}</div>`;setTimeout(()=>toastBox.innerHTML="",1700)}
function pop(m){comboBox.innerHTML=`<div class="combo">${m}</div>`;setTimeout(()=>comboBox.innerHTML="",900)}
function confetti(n=100){confettiBox.innerHTML="";for(let i=0;i<n;i++){confettiBox.innerHTML+=`<i style="left:${Math.random()*100}vw;top:-20px;background:hsl(${Math.random()*360},95%,60%);animation-delay:${Math.random()*.45}s"></i>`}setTimeout(()=>confettiBox.innerHTML="",2300)}
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function makeDeck(){let base=state.paper==="All"?QUESTIONS:QUESTIONS.filter(q=>q.paper===state.paper);if(state.mode==="Review Dojo"&&state.review.length)base=base.filter(q=>state.review.includes(q.id));state.deck=shuffle(base);if(state.mode==="TikTok 10")state.deck=state.deck.slice(0,10);if(state.mode==="Boss Tower")state.deck=state.deck.filter(q=>q.rarity!=="common").slice(0,15);if(state.mode==="Story Obby")state.deck=state.deck.slice(0,12);if(!state.deck.length)state.deck=shuffle(QUESTIONS).slice(0,10);state.index=0;state.selected="";state.typed="";state.locked=false;state.zoom=1;state.hearts=state.mode==="Boss Tower"?2:3;startTimer()}
function startGame(mode){state.mode=mode;state.screen="game";state.score=0;state.streak=0;makeDeck();render()}
function setPaper(p){state.paper=p;makeDeck();render()}
function startTimer(){clearInterval(state.timerId);state.timer=state.mode==="TikTok 10"?40:state.mode==="Boss Tower"?32:0;if(state.timer>0){state.timerId=setInterval(()=>{if(!state.locked&&state.screen==="game"){state.timer--;if(state.timer<=5&&state.timer>0)beep(440,.035,"square");if(state.timer<=0)mark(false,true);render()}},1000)}}
function q(){return state.deck[state.index]}
function normalize(s){return String(s||"").toLowerCase().trim().replace(/[−–—]/g,"-").replace(/²/g,"2").replace(/³/g,"3").replace(/×/g,"x").replace(/degrees?|degree|fahrenheit|celsius/g,"").replace(/([0-9])\s*°?\s*[cf]\b/g,"$1").replace(/metres|meters/g,"m").replace(/litres/g,"l").replace(/minutes|minute|mins|min/g,"m").replace(/seconds|second|secs|sec/g,"s").replace(/hours|hour|hrs|hr/g,"h").replace(/pounds?/g,"£").replace(/\s+/g,"").replace(/[£°',()]/g,"").replace(/and/g,"")}
function isCorrect(){if(hasChoiceKey()&&state.selected){return selectedLetterCorrect()}return normalize(state.typed||state.selected)===normalize(q().answer)}

function choiceInfo(){return (window.CHOICE_MAP&&q&&q()&&window.CHOICE_MAP[q().id])?window.CHOICE_MAP[q().id]:null}
function hasChoiceKey(){let m=choiceInfo();return !!(m&&m.correctLetter)}
function selectedLetterCorrect(){let m=choiceInfo();return !!(m&&m.correctLetter&&state.selected&&state.selected.toUpperCase()===m.correctLetter.toUpperCase())}
function choiceStatusText(){let m=choiceInfo();if(!m)return "Run extractor for A-E auto-marking.";if(m.correctLetter)return "Auto-marking A-E choices enabled.";return "A-E key not found for this question; use typed answer or peek answer."}

function selectLetter(l){if(state.locked)return;state.selected=l;state.typed=l;beep(520,.05);vibrate(18);render()}
function updateTyped(v){state.typed=v;state.selected="";render()}
function check(){if(state.locked)return;if(!state.typed&&!state.selected){toast("Pick A-E or type an answer");beep(180,.1);return}mark(isCorrect(),false)}
function mark(ok,timeout=false){if(state.locked)return;state.locked=true;state.lastCorrect=ok;state.totalPlayed++;if(ok){let ns=state.streak+1;state.score++;state.streak=ns;state.bestStreak=Math.max(state.bestStreak,ns);let reward=25+Math.min(ns*7,80)+(isBoss()?50:0);state.coins+=reward;state.xp+=35+(isBoss()?35:0);state.totalCorrect++;removeReview(q().id);beep(900,.12);vibrate(40);pop(ns>=5?`🔥 ${ns}x`:"JUMP!");if(ns%3===0){state.coins+=30;toast("Treasure chest! +30 coins");confetti(80)}else toast(`+${reward} coins`);levelUp();claimDailyMaybe()}else{state.streak=0;state.hearts=Math.max(0,state.hearts-1);addReview(q().id);beep(timeout?160:220,.18,"sawtooth");vibrate([40,30,40]);toast(timeout?"⏰ Time up!":"Saved to Review Dojo")}save();render()}
function levelUp(){let need=state.level*250;if(state.xp>=need){state.xp-=need;state.level++;state.gems+=2;toast(`LEVEL UP! ${state.level}`);confetti(160)}}
function claimDailyMaybe(){checkDaily();if(!state.dailyClaimed&&state.score>=5){state.dailyClaimed=true;state.gems++;state.coins+=100;toast("Daily reward: +100 coins +1 gem");confetti(130);save()}}
function addReview(id){let s=new Set(state.review);s.add(id);state.review=[...s];localStorage.setItem("galaxy-review",JSON.stringify(state.review))}
function removeReview(id){state.review=state.review.filter(x=>x!==id);localStorage.setItem("galaxy-review",JSON.stringify(state.review))}
function next(){clearInterval(state.timerId);if(state.index+1>=state.deck.length||state.hearts===0){state.screen="finish";confetti(180);save();render();return}state.index++;state.selected="";state.typed="";state.locked=false;state.lastCorrect=null;state.zoom=1;startTimer();render()}
function isBoss(){return state.mode==="Boss Tower"||q().rarity==="legendary"||state.index===state.deck.length-1}
function zoomIn(){state.zoom=Math.min(2.5,state.zoom+.15);render()}function zoomOut(){state.zoom=Math.max(.65,state.zoom-.15);render()}
function rank(){let r=state.deck.length?state.score/state.deck.length:0;if(r===1)return"Galaxy Legend";if(r>=.8)return"Diamond Obby Pro";if(r>=.6)return"Crystal Climber";if(r>=.4)return"Rising Star";return"Rookie Runner"}
function buy(icon,cost){if(state.owned.includes(icon)){state.avatar=icon;save();render();return}if(state.coins<cost){toast("Need more coins");return}state.coins-=cost;state.owned.push(icon);state.avatar=icon;save();toast("Unlocked "+icon);confetti(80);render()}
function reveal(){let m=choiceInfo();toast("Answer: "+(m&&m.correctLetter?m.correctLetter+" = ":"")+q().answer)}
function toggleSound(){state.sound=!state.sound;save();render()}
function goHome(){clearInterval(state.timerId);state.screen="home";render()}
function resetProgress(){if(confirm("Reset saved coins, level, avatars and review list?")){localStorage.removeItem(SAVE);localStorage.removeItem("galaxy-review");location.reload()}}
function acc(){return state.totalPlayed?Math.round(state.totalCorrect/state.totalPlayed*100):0}
function quest(name,val,max){return`<div class="quest"><b>${name}</b><div class="questbar"><div style="width:${Math.min(100,val/max*100)}%"></div></div><small>${val}/${max}</small></div>`}
function badges(){let b=[["🔥",state.bestStreak>=5,"5 Streak"],["💎",state.gems>=3,"3 Gems"],["👑",state.level>=5,"Level 5"],["🧠",state.review.length===0,"Clean Review"],["⚡",state.totalCorrect>=20,"20 Correct"],["🚀",acc()>=80&&state.totalPlayed>=10,"80% Accuracy"]];return `<div class="badges">${b.map(x=>`<div class="badge ${x[1]?"":"locked"}"><div style="font-size:26px">${x[0]}</div><small>${x[2]}</small></div>`).join("")}</div>`}
function header(){return `<div class="header"><div class="brand"><div class="avatar">${state.avatar}</div><div><h1>11+ Galaxy Obby</h1><div class="subtitle">A Roblox-style maths adventure with TikTok-fast battles</div></div></div><div class="stats"><div class="stat"><b>${state.level}</b><span>Level</span></div><div class="stat"><b>${state.coins}</b><span>Coins</span></div><div class="stat"><b>${state.gems}</b><span>Gems</span></div><div class="stat"><b>${state.streak}</b><span>Streak</span></div><div class="stat"><b>${state.hearts}</b><span>Lives</span></div><div class="stat"><b>${acc()}%</b><span>Accuracy</span></div></div></div>`}
function renderHome(){checkDaily();app.innerHTML=header()+`<div class="homeGrid"><section class="hero"><h2>Ready to beat the Maths Obby?</h2><p>Clear platforms, earn coins, hatch avatars, and master only your selected 168 GL questions. Wrong answers become Review Dojo challenges.</p><div class="bigModes"><button class="modeBtn" onclick="startGame('Story Obby')"><strong>🌍 Story Obby</strong><small>12-question adventure run</small><em>🏃</em></button><button class="modeBtn" onclick="startGame('TikTok 10')"><strong>📱 TikTok 10</strong><small>Fast 40-second battles</small><em>⚡</em></button><button class="modeBtn" onclick="startGame('Boss Tower')"><strong>👑 Boss Tower</strong><small>rare and legendary platforms</small><em>🔥</em></button><button class="modeBtn" onclick="startGame('Review Dojo')"><strong>🧠 Review Dojo</strong><small>${state.review.length} questions to fix</small><em>🥋</em></button></div></section><aside class="glass"><div class="petBox"><div class="pet">${state.avatar}</div><div class="petSpeech">${state.dailyClaimed?"Daily reward claimed. Nice work!":"Get 5 correct today for +100 coins and +1 gem."}</div></div><h3>Choose world</h3><div class="paperGrid">${PAPERS.map(p=>`<button class="${state.paper===p?"active":""}" onclick="state.paper='${p}';render()">${p}</button>`).join("")}</div><h3>Badges</h3>${badges()}<h3>Parent snapshot</h3><table class="parentTable"><tr><th>Correct</th><td>${state.totalCorrect}</td></tr><tr><th>Played</th><td>${state.totalPlayed}</td></tr><tr><th>Accuracy</th><td>${acc()}%</td></tr><tr><th>Review</th><td>${state.review.length}</td></tr></table><button class="primary" onclick="startGame('Story Obby')" style="width:100%;margin-top:12px">Start Playing</button><button onclick="resetProgress()" style="width:100%;margin-top:8px">Reset Progress</button></aside></div>`}
function renderGame(){let cur=q(),prog=((state.index+(state.locked?1:0))/state.deck.length)*100,xpNeed=state.level*250;let result=state.locked?`<div class="result ${state.lastCorrect?"correct":"wrong"}">${state.lastCorrect?"✅ Correct! You jumped to the next platform.":"❌ Oof! Correct answer: <b>"+cur.answer+"</b>"}</div><button class="primary" style="width:100%;margin-top:10px" onclick="next()">Next Platform →</button>`:"";app.innerHTML=header()+`<div class="paperGrid" style="margin-bottom:10px"><button onclick="goHome()">🏠 Home</button>${PAPERS.map(p=>`<button class="${state.paper===p?"active":""}" onclick="setPaper('${p}')">${p}</button>`).join("")}<button onclick="toggleSound()">🔊 ${state.sound?"On":"Off"}</button></div><div class="track"><div class="trackFill" style="width:${prog}%"></div><div class="runner" style="left:${prog}%">${state.avatar}</div></div><div class="main"><section class="arena"><div class="arenaTop"><div><span class="tag">${cur.world}</span><span class="tag ${cur.rarity}">${cur.rarity.toUpperCase()}</span><span class="tag">${cur.id}</span>${isBoss()?'<span class="tag boss">BOSS</span>':""}<div class="small">${state.mode} · Platform ${state.index+1} of ${state.deck.length}</div><h2>${cur.paper} · Question ${cur.questionNumber}</h2><div class="small">Exact local PDF page: ${cur.page}</div></div><div><div class="timer">${state.timer>0?'⏱ '+state.timer:''}</div><div class="zoom"><button onclick="zoomOut()">−</button><button onclick="zoomIn()">+</button></div></div></div><div class="imageFrame"><img src="${cur.image}" alt="${cur.id}" style="width:${100*state.zoom}%;" onerror="this.outerHTML='<div style=&quot;padding:40px;color:#334155&quot;><h2>Page image missing</h2><p>Run: python scripts/render_gl_pages.py</p></div>'"></div></section><aside class="side"><div class="card"><h3>🎮 Battle Pad</h3><p>Tap A-E from the PDF choices. Typing is optional only if a choice key could not be extracted.</p><div class="answers">${["A","B","C","D","E"].map(l=>`<button class="answer ${state.selected===l?"selected":""}" onclick="selectLetter('${l}')">${l}</button>`).join("")}</div><input class="input" value="${String(state.typed||"").replace(/"/g,"&quot;")}" oninput="updateTyped(this.value)" placeholder="Optional fallback: type answer if A-E key is missing" ${state.locked?"disabled":""}><div class="small" style="color:#dbeafe;margin-top:8px">${choiceStatusText()}</div>${!state.locked?`<button class="primary" style="width:100%;margin-top:10px" onclick="check()">CHECK & JUMP</button><button style="width:100%;margin-top:8px" onclick="reveal()">Peek Answer</button>`:""}${result}</div><div class="card"><h3>📺 Mini Feed</h3><div class="reel"><div class="clip"><b>🔥 Combo Streaks</b><span>Every 3 correct opens a treasure chest.</span></div><div class="clip"><b>🧠 Review Dojo</b><span>Missed questions are saved for practice.</span></div><div class="clip"><b>👑 Boss Platforms</b><span>Legendary questions give bigger rewards.</span></div></div></div><div class="card"><h3>🎯 Quests</h3>${quest("5 correct today",Math.min(state.score,5),5)}${quest("XP to level "+(state.level+1),state.xp,xpNeed)}${quest("5x streak",Math.min(state.streak,5),5)}</div><div class="card"><h3>🛒 Avatar Shop</h3><div class="shop">${shop.map(([i,c])=>`<div class="shopItem"><div class="emo">${i}</div><b>${state.owned.includes(i)?"Owned":c+" coins"}</b><button onclick="buy('${i}',${c})">${state.owned.includes(i)?"Use":"Buy"}</button></div>`).join("")}</div></div></aside></div>`}
function renderFinish(){app.innerHTML=`<div class="modal"><div class="modalBox"><div style="font-size:82px">${state.avatar}</div><h2>${rank()}</h2><p>Run complete. Your rewards are saved.</p><div class="summary"><div><b>${state.score}</b><span>Correct</span></div><div><b>${state.deck.length}</b><span>Total</span></div><div><b>${state.coins}</b><span>Coins</span></div><div><b>${state.gems}</b><span>Gems</span></div><div><b>${state.level}</b><span>Level</span></div></div><button class="primary" onclick="startGame(state.mode)">Play Again</button><button onclick="goHome()" style="margin-left:8px">Home</button></div></div>`}
function render(){if(state.screen==="home")renderHome();else if(state.screen==="finish")renderFinish();else renderGame()}
render();
</script>
</body>
</html>
